name: Paper Trade

on:
  schedule:
    # Every 15 minutes, aligned with the 15m candle. GitHub can delay scheduled
    # runs under load; the bot is idempotent per candle, so a late or duplicated
    # run is skipped rather than double-traded.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      symbol:
        description: "Market to trade"
        required: false
        default: "BTC/INR"
      force:
        description: "Reprocess the candle even if already handled"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

# A single concurrent run per branch; a queued run is cancelled rather than
# allowed to race the state file.
concurrency:
  group: paper-trade-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  SYMBOL: ${{ github.event.inputs.symbol || 'BTC/INR' }}

jobs:
  trade:
    name: Run strategies on ${{ github.event.inputs.symbol || 'BTC/INR' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so the commit step has a branch to push to.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the paper-trading bot
        run: |
          ARGS="--symbol $SYMBOL"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python bot.py $ARGS

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: paper-trade tick ${SYMBOL} [skip ci]"
            # Retry once: a concurrent push to the same branch would fail the first try.
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}"
          fi

      - name: Upload state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-json-${{ github.run_number }}
          path: docs/data.json
          retention-days: 30
