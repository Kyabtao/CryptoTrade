name: Tests

on:
  push:
    branches: ["**"]
    paths: ["bot.py", "tests/**", "requirements*.txt", "ci/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ccxt 4.x requires Python >= 3.10.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: python -m pyflakes bot.py tests/

      - name: Test
        # The suite drives the engine over synthetic OHLCV, so it needs no
        # network access and no exchange credentials.
        run: python -m pytest tests/ -q

      - name: Smoke-test the CLI
        run: |
          python bot.py --version
          python bot.py --init --state /tmp/smoke.json
          python bot.py --help > /dev/null
